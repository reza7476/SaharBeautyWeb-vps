name: Build & Push Frontend

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SaharBeautyWeb.sln

      - name: Build
        run: dotnet build SaharBeautyWeb.sln --configuration Release --no-restore

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/reza7476/saharbeautyweb:latest \
            .

      - name: Push Docker Image
        run: |
          docker push ghcr.io/reza7476/saharbeautyweb:latest